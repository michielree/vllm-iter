name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      UV_LINK_MODE: copy
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Run fast tests
        run: uv run pytest -m "not slow and not integration"

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uv run --with twine twine check dist/*

      - name: Publish package
        run: uv publish
